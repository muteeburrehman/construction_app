services:
  db:
    image: postgres:16-alpine
    container_name: eric_sherwood_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: eric_sherwood_db
      POSTGRES_USER: eric_user
      POSTGRES_PASSWORD: eric_secret_napa
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eric_user -d eric_sherwood_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eric_sherwood_web
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-demo-secret-key-napa-valley-1979}
      - DATABASE_URL=postgres://eric_user:eric_secret_napa@db:5432/eric_sherwood_db
      - ALLOWED_HOSTS=*
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_volume:/app/backend/media
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    container_name: eric_sherwood_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media_volume:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  media_volume:
  caddy_data:
  caddy_config:
